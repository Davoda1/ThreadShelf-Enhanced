name: CI

'on':
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ONNXRUNTIME_NODE_INSTALL: skip
  THREADSHELF_NODE_VERSION: 24.22.1
  THREADSHELF_NPM_VERSION: 12.2.1

jobs:
  full-check:
    name: Full check (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run portable Linux setup
        timeout-minutes: 10
        run: |
          bash setup-threadshelf.sh
          case "$(uname -m)" in
            x86_64) architecture=x64 ;;
            aarch64|arm64) architecture=arm64 ;;
            *) echo 'Unsupported runner architecture.' >&2; exit 1 ;;
          esac
          runtime="$GITHUB_WORKSPACE/.local/node-v${THREADSHELF_NODE_VERSION}-linux-${architecture}"
          test "$("$runtime/bin/node" --version)" = "v$THREADSHELF_NODE_VERSION"
          test "$(PATH="$runtime/bin:$PATH" "$runtime/bin/npm" --version)" = "$THREADSHELF_NPM_VERSION"
          echo "$runtime/bin" >> "$GITHUB_PATH"
          echo "npm_config_prefix=$runtime" >> "$GITHUB_ENV"
          echo "npm_config_cache=$GITHUB_WORKSPACE/.local/npm-cache" >> "$GITHUB_ENV"
          echo "XDG_CACHE_HOME=$GITHUB_WORKSPACE/.local/cache" >> "$GITHUB_ENV"
          echo "HF_HOME=$GITHUB_WORKSPACE/.local/huggingface" >> "$GITHUB_ENV"
          echo "THREADSHELF_TEST_LOG_DIR=$RUNNER_TEMP/threadshelf-test-logs" >> "$GITHUB_ENV"

      - name: Check the installed runtime
        timeout-minutes: 1
        run: |
          test "$(node --version)" = "v$THREADSHELF_NODE_VERSION"
          test "$(npm --version)" = "$THREADSHELF_NPM_VERSION"
          ./threadshelf-enhanced --check-runtime

      - name: Cache embedding model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .threadshelf/model-cache
          key: ${{ runner.os }}-embeddings-paraphrase-multilingual-minilm-l12-v2

      - name: Install Playwright Chromium
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium

      # These named steps preserve every gate in npm run check and expose failures.
      - name: Repository hygiene
        timeout-minutes: 2
        run: npm run check:repo

      - name: Lint
        timeout-minutes: 3
        run: npm run lint

      - name: Server TypeScript
        timeout-minutes: 3
        run: npx tsc --noEmit

      - name: Prepare and verify real embeddings
        timeout-minutes: 5
        run: |
          node --import tsx --input-type=module <<'JS'
          import { embedOne } from './src/embedding.ts';
          console.log('Preparing the real embedding model; download progress follows.');
          const started = Date.now();
          const vector = await embedOne('synthetic CI readiness probe');
          if (vector.length !== 384 || !vector.every(Number.isFinite)) {
            throw new Error('Embedding readiness check requires 384 finite values.');
          }
          console.log(`Real embedding readiness passed in ${Date.now() - started} ms (384 finite values).`);
          JS

      - name: Unit and regression tests
        timeout-minutes: 5
        run: npm test

      - name: HTTP API and MCP integration tests
        timeout-minutes: 8
        run: npm run test:e2e

      - name: Client TypeScript and production build
        timeout-minutes: 5
        run: npm run build:client

      - name: Chromium browser regressions
        timeout-minutes: 12
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/test-results/playwright-report.json
        run: npm run test:playwright -- --reporter=github,json

      - name: Build compiled server
        timeout-minutes: 3
        run: npm run build:server

      - name: Upload Linux failure diagnostics
        if: ${{ failure() || cancelled() }}
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-test-diagnostics-${{ github.run_attempt }}
          path: |
            test-results/
            ${{ runner.temp }}/threadshelf-test-logs/
          if-no-files-found: ignore
          include-hidden-files: false
          retention-days: 7

  windows-core:
    name: Portable setup and core checks (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run portable Windows setup
        timeout-minutes: 10
        run: |
          ./setup-threadshelf.ps1
          $Architecture = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString().ToLowerInvariant()
          $Runtime = Join-Path $PWD ".local/node-v$env:THREADSHELF_NODE_VERSION-win-$Architecture"
          if ((& "$Runtime/node.exe" --version) -ne "v$env:THREADSHELF_NODE_VERSION") { throw 'Unexpected Node version.' }
          if ((& "$Runtime/npm.cmd" --version) -ne $env:THREADSHELF_NPM_VERSION) { throw 'Unexpected npm version.' }
          $Runtime | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "THREADSHELF_CI_RUNTIME=$Runtime" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "npm_config_prefix=$Runtime" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "npm_config_cache=$(Join-Path $PWD '.local/npm-cache')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "THREADSHELF_TEST_LOG_DIR=$(Join-Path $env:RUNNER_TEMP 'threadshelf-test-logs')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Repository hygiene
        timeout-minutes: 2
        run: |
          & "$env:THREADSHELF_CI_RUNTIME/npm.cmd" run check:repo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Lint
        timeout-minutes: 3
        run: |
          & "$env:THREADSHELF_CI_RUNTIME/npm.cmd" run lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Server TypeScript
        timeout-minutes: 3
        run: |
          & "$env:THREADSHELF_CI_RUNTIME/node.exe" node_modules/typescript/bin/tsc --noEmit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Unit and regression tests
        timeout-minutes: 5
        run: |
          & "$env:THREADSHELF_CI_RUNTIME/npm.cmd" test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke-test the compiled server
        timeout-minutes: 3
        run: |
          $SmokeDir = Join-Path $env:RUNNER_TEMP ("threadshelf-smoke-" + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $SmokeDir | Out-Null
          $Listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $Listener.Start()
          $SmokePort = $Listener.LocalEndpoint.Port
          $Listener.Stop()
          $env:HOST = '127.0.0.1'
          $env:PORT = "$SmokePort"
          $env:THREADSHELF_DATA_DIR = $SmokeDir
          $Server = $null
          try {
            $Server = Start-Process -FilePath "$env:THREADSHELF_CI_RUNTIME/node.exe" -ArgumentList 'dist/src/server.js' -PassThru -NoNewWindow -RedirectStandardOutput "$SmokeDir/stdout.log" -RedirectStandardError "$SmokeDir/stderr.log"
            $Ready = $false
            for ($Attempt = 0; $Attempt -lt 40; $Attempt++) {
              $Server.Refresh()
              if ($Server.HasExited) { throw "Server exited with code $($Server.ExitCode)." }
              try {
                $Response = Invoke-WebRequest -Uri "http://127.0.0.1:$SmokePort/api/health" -TimeoutSec 2
                if ($Response.StatusCode -eq 200) { $Ready = $true; break }
              } catch { Start-Sleep -Milliseconds 500 }
            }
            if (-not $Ready) { throw 'Server did not become healthy.' }
            $Ui = Invoke-WebRequest -Uri "http://127.0.0.1:$SmokePort/" -TimeoutSec 5
            if ($Ui.StatusCode -ne 200) { throw 'Built UI was not served.' }
            $Capabilities = Invoke-WebRequest -Uri "http://127.0.0.1:$SmokePort/api/reader/capabilities" -TimeoutSec 5
            if ($Capabilities.StatusCode -ne 200) { throw 'Reader capabilities were unavailable.' }
          } catch {
            New-Item -ItemType Directory -Force -Path $env:THREADSHELF_TEST_LOG_DIR | Out-Null
            foreach ($Name in @('stdout.log', 'stderr.log')) {
              $LogPath = Join-Path $SmokeDir $Name
              if (Test-Path $LogPath) {
                $Stream = [System.IO.File]::OpenRead($LogPath)
                try {
                  $Size = [int][Math]::Min(131072, $Stream.Length)
                  $null = $Stream.Seek(-$Size, [System.IO.SeekOrigin]::End)
                  $Bytes = New-Object byte[] $Size
                  $Read = $Stream.Read($Bytes, 0, $Size)
                  $Tail = [System.Text.Encoding]::UTF8.GetString($Bytes, 0, $Read)
                  $Tail | Set-Content -LiteralPath (Join-Path $env:THREADSHELF_TEST_LOG_DIR "windows-smoke-$Name")
                  Write-Host $Tail
                } finally { $Stream.Dispose() }
              }
            }
            throw
          } finally {
            if ($Server -and -not $Server.HasExited) { Stop-Process -Id $Server.Id -Force; $Server.WaitForExit() }
            Remove-Item -LiteralPath $SmokeDir -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Upload Windows failure diagnostics
        if: ${{ failure() || cancelled() }}
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-test-diagnostics-${{ github.run_attempt }}
          path: ${{ runner.temp }}/threadshelf-test-logs/
          if-no-files-found: ignore
          include-hidden-files: false
          retention-days: 7

  source-packages:
    name: Source packaging (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Source packaging regressions
        timeout-minutes: 5
        run: python test/source-release.test.py

      - name: Build committed source archives
        timeout-minutes: 2
        run: python scripts/release-source.py --output "$RUNNER_TEMP/threadshelf-source"

      - name: Audit committed source archives
        timeout-minutes: 2
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import tarfile
          import zipfile
          from pathlib import Path
          version = json.loads(Path('package.json').read_text())['version']
          prefix = 'ThreadShelf-Enhanced-' + version + '-Source'
          directory = Path(os.environ['RUNNER_TEMP']) / 'threadshelf-source'
          expected = {prefix + '.zip', prefix + '.tar.gz'}
          assets = sorted(directory.iterdir())
          if {path.name for path in assets} != expected:
              raise SystemExit('Expected exactly the source ZIP and TAR.GZ.')
          with zipfile.ZipFile(directory / (prefix + '.zip')) as archive:
              zip_names = set(archive.namelist())
          with tarfile.open(directory / (prefix + '.tar.gz')) as archive:
              tar_names = set(archive.getnames())
          if zip_names != tar_names:
              raise SystemExit('Source archive file lists differ.')
          required = ['README.md', 'LICENSE', 'THIRD_PARTY_NOTICES.md', '.env.example',
                      'setup-threadshelf.sh', 'setup-threadshelf.ps1', 'threadshelf-enhanced']
          if not all(prefix + '/' + name in zip_names for name in required):
              raise SystemExit('Required source files or notices are missing.')
          excluded = {'.env', '.git', '.local', 'node_modules', '.lancedb', '.uploads', '.threadshelf'}
          for name in zip_names:
              parts = name.split('/')[1:]
              if any(part in excluded for part in parts):
                  raise SystemExit('An excluded local-data path appears in a source archive.')
          for asset in assets:
              with asset.open('rb') as source:
                  digest = hashlib.file_digest(source, 'sha256').hexdigest()
              print(asset.name, 'files=', len(zip_names), 'sha256=', digest)
          PY
