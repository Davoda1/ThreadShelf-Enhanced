name: Source release

'on':
  push:
    tags: ['v*']
  # For manual runs, select the existing version tag as the workflow ref.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release source
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: Publish source ZIP, TAR.GZ and checksums
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout the validated tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Require the validated source on master before publishing
        timeout-minutes: 11
        run: |
          # A release tag may be pushed while its protected PR is still validating.
          # Required checks and merge approval remain owned by the branch rules.
          for attempt in $(seq 1 60); do
            git fetch --no-tags origin master
            if git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
              exit 0
            fi
            echo "Waiting for the protected pull request to merge (${attempt}/60)."
            sleep 10
          done
          echo 'Release source has not reached master; no release will be created.' >&2
          exit 1

      - name: Check the release version
        id: version
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          package = json.loads(Path('package.json').read_text())
          version = package['version']
          if not re.fullmatch(r'\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?', version):
              raise SystemExit('Unsupported release version.')
          if os.environ['GITHUB_REF_TYPE'] != 'tag':
              raise SystemExit('Run source releases from an existing version tag, not a branch.')
          if os.environ['GITHUB_REF_NAME'] != 'v' + version:
              raise SystemExit('Release tag does not match package.json version.')
          if package.get('private') is not True:
              raise SystemExit('Enhanced must remain a private npm package.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('value=' + version + '\n')
          PY

      - name: Build source archives and consolidated checksums
        run: python3 scripts/release-source.py --output release

      - name: Verify assets and prepare release notes
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          version = os.environ['RELEASE_VERSION']
          prefix = 'ThreadShelf-Enhanced-' + version + '-Source'
          archive_names = {prefix + '.zip', prefix + '.tar.gz'}
          expected = archive_names | {'SHA256SUM.txt'}
          assets = sorted(Path('release').iterdir())
          if {path.name for path in assets} != expected or not all(path.is_file() for path in assets):
              raise SystemExit('Release must contain exactly the source ZIP, TAR.GZ and SHA256SUM.txt.')
          checksum_lines = []
          for name in sorted(archive_names):
              with (Path('release') / name).open('rb') as source:
                  digest = hashlib.file_digest(source, 'sha256').hexdigest()
              checksum_lines.append(digest + '  ' + name + '\n')
          checksum_bytes = ''.join(checksum_lines).encode('ascii')
          if Path('release/SHA256SUM.txt').read_bytes() != checksum_bytes:
              raise SystemExit('Consolidated source checksums do not match both archives.')
          lines = [f'# ThreadShelf Enhanced {version}', '',
                   'Improved ChatGPT and Grok archive rendering, VeniceAI citations and safe HTML formatting.', '',
                   '- Bounded Grok card rendering with explicit same-message reference binding, safe saved links, controlled images and passive archived actions.',
                   '- Expanded ChatGPT citation metadata, navigation lists and file-citation chips, retaining exact IDs, file ranges and original source.',
                   '- Supported literal Chart.js charts and task fences, including area and doughnut charts, with readable fallbacks for unsupported semantics.',
                   '- Theme-aware soft-square VeniceAI ^number^ labels without invented source URLs; code, escapes and math retain their source.',
                   '- Inert HTML formatting and allowlisted text CSS in user and response bubbles; unsupported or unsafe markup remains visible source.',
                   '- Original messages, whole-message copy, exports, rich/basic preferences, image-loading controls and existing code/SVG tools remain available.', '',
                   'Existing archives, vectors, identities and Local Suite APIs remain compatible. No reimport or re-embedding is required.', '',
                   'Extract either source archive and follow README.md. Setup installs Node 26.13.0 LTS and npm 12.2.1 locally.', '',
                   'Before upgrading, stop all server, MCP, importer and watcher processes. Keep the complete stopped backup and follow docs/MIGRATION.md. Upgrade all writers together.', '',
                   'Speech starts disabled and no voice models or runtimes are included in source. Review downloads explicitly in Settings.', '',
                   'See CHANGELOG.md, docs/RENDERING-1.4.2.md, docs/SAFE-HTML-RENDERING.md, THIRD_PARTY_NOTICES.md and docs/ENHANCED_COMPATIBILITY.md for changes, licensing and limits.', '',
                   'Published only after dependency security, Linux/Windows functional and source-packaging checks pass.',
                   'Use the single SHA256SUM.txt asset to verify both source archives.', '',
                   '## SHA-256', '', '```text']
          lines.extend(line.rstrip('\n') for line in checksum_lines)
          lines.extend(['```', ''])
          (Path(os.environ['RUNNER_TEMP']) / 'threadshelf-release-notes.md').write_text('\n'.join(lines))
          PY

      - name: Create the GitHub source release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          prefix="release/ThreadShelf-Enhanced-${RELEASE_VERSION}-Source"
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "ThreadShelf Enhanced ${RELEASE_VERSION}" \
            --notes-file "$RUNNER_TEMP/threadshelf-release-notes.md" \
            "${prefix}.zip" "${prefix}.tar.gz" "release/SHA256SUM.txt"
