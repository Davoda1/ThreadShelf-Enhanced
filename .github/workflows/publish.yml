name: Source release

'on':
  push:
    tags: ['v*']
  # For manual runs, select the existing version tag as the workflow ref.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release source
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: Publish source ZIP, TAR.GZ and checksums
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout the validated tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the release version
        id: version
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          package = json.loads(Path('package.json').read_text())
          version = package['version']
          if not re.fullmatch(r'\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?', version):
              raise SystemExit('Unsupported release version.')
          if os.environ['GITHUB_REF_TYPE'] != 'tag':
              raise SystemExit('Run source releases from an existing version tag, not a branch.')
          if os.environ['GITHUB_REF_NAME'] != 'v' + version:
              raise SystemExit('Release tag does not match package.json version.')
          if package.get('private') is not True:
              raise SystemExit('Enhanced must remain a private npm package.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('value=' + version + '\n')
          PY

      - name: Build source archives and consolidated checksums
        run: python3 scripts/release-source.py --output release

      - name: Verify assets and prepare release notes
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          version = os.environ['RELEASE_VERSION']
          prefix = 'ThreadShelf-Enhanced-' + version + '-Source'
          archive_names = {prefix + '.zip', prefix + '.tar.gz'}
          expected = archive_names | {'SHA256SUM.txt'}
          assets = sorted(Path('release').iterdir())
          if {path.name for path in assets} != expected or not all(path.is_file() for path in assets):
              raise SystemExit('Release must contain exactly the source ZIP, TAR.GZ and SHA256SUM.txt.')
          checksum_lines = []
          for name in sorted(archive_names):
              with (Path('release') / name).open('rb') as source:
                  digest = hashlib.file_digest(source, 'sha256').hexdigest()
              checksum_lines.append(digest + '  ' + name + '\n')
          checksum_bytes = ''.join(checksum_lines).encode('ascii')
          if Path('release/SHA256SUM.txt').read_bytes() != checksum_bytes:
              raise SystemExit('Consolidated source checksums do not match both archives.')
          lines = [f'# ThreadShelf Enhanced {version}', '',
                   'Independent fork based on [ThreadShelf v1.3.0](https://github.com/ChrystianSchutz/ThreadShelf/tree/v1.3.0), with upstream history and license retained.', '',
                   '- Bounded import staging and atomic archive/index publication, with memory-pressure monitoring.',
                   '- Persistent background import jobs, progress, cancellation and retry after upload acceptance.',
                   '- Finished-job history clearing, completed progress at 100%, and a Manage uploads dialog for uploaded-file cleanup.',
                   '- Coordinated server/indexer ownership and safe collection replacement; unrelated files are skipped.',
                   '- Six interface languages and animated per-role rich-rendering switches that preserve basic Markdown when off.',
                   '- Inline click/automatic image loading and an optional server-only image cache partitioned by collection.',
                   '- Existing archive APIs, Local Reader compatibility and project-local setup retained.', '',
                   'Extract either source archive and follow README.md. Node 24.22.1 LTS and npm 12.2.1 are installed locally by setup.', '',
                   'Before upgrading, stop every server, MCP, importer and watcher process and back up the complete data directory. Upgrade all writers together. Do not open a 1.3.0-written store with an older server.', '',
                   'See CHANGELOG.md for changes, THIRD_PARTY_NOTICES.md for retained licenses, and docs/ENHANCED_COMPATIBILITY.md for known limitations.', '',
                   'This release requires passing dependency security checks, Linux/Windows CI and bounded-memory storage checks before publication.',
                   'Use the single SHA256SUM.txt asset to verify both source archives.', '',
                   '## SHA-256', '', '```text']
          lines.extend(line.rstrip('\n') for line in checksum_lines)
          lines.extend(['```', ''])
          (Path(os.environ['RUNNER_TEMP']) / 'threadshelf-release-notes.md').write_text('\n'.join(lines))
          PY

      - name: Create the GitHub source release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          prefix="release/ThreadShelf-Enhanced-${RELEASE_VERSION}-Source"
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "ThreadShelf Enhanced ${RELEASE_VERSION}" \
            --notes-file "$RUNNER_TEMP/threadshelf-release-notes.md" \
            "${prefix}.zip" "${prefix}.tar.gz" "release/SHA256SUM.txt"
