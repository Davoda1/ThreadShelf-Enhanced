name: Source release

'on':
  push:
    tags: ['v*']
  # For manual runs, select the existing version tag as the workflow ref.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release source
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: Publish source ZIP and TAR.GZ
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout the validated tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the release version
        id: version
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          package = json.loads(Path('package.json').read_text())
          version = package['version']
          if not re.fullmatch(r'\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?', version):
              raise SystemExit('Unsupported release version.')
          if os.environ['GITHUB_REF_TYPE'] != 'tag':
              raise SystemExit('Run source releases from an existing version tag, not a branch.')
          if os.environ['GITHUB_REF_NAME'] != 'v' + version:
              raise SystemExit('Release tag does not match package.json version.')
          if package.get('private') is not True:
              raise SystemExit('Enhanced must remain a private npm package.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('value=' + version + '\n')
          PY

      - name: Build the two source archives
        run: python3 scripts/release-source.py --output release

      - name: Verify assets and prepare release notes
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          version = os.environ['RELEASE_VERSION']
          prefix = 'ThreadShelf-Enhanced-' + version + '-Source'
          expected = {prefix + '.zip', prefix + '.tar.gz'}
          assets = sorted(Path('release').iterdir())
          if {path.name for path in assets} != expected or not all(path.is_file() for path in assets):
              raise SystemExit('Release must contain exactly the source ZIP and TAR.GZ.')
          lines = [f'# ThreadShelf Enhanced {version}', '',
                   'Independent fork based on [ThreadShelf v1.3.0](https://github.com/ChrystianSchutz/ThreadShelf/tree/v1.3.0), with upstream history and license retained.', '',
                   '- Security-maintained application dependencies and verified offline renderer bundles.',
                   '- Required dependency audits, upload lifecycle regressions and Linux/Windows validation.',
                   '- Existing archive APIs, Local Reader compatibility and project-local setup retained.', '',
                   'Extract either source archive and follow README.md. Node 24.22.1 LTS and npm 12.2.1 are installed locally by setup.', '',
                   'See CHANGELOG.md for changes, THIRD_PARTY_NOTICES.md for retained licenses, and docs/ENHANCED_COMPATIBILITY.md for known limitations.', '',
                   'This release requires passing dependency security checks and Linux/Windows CI before publication.', '',
                   '## SHA-256', '', '```text']
          for path in assets:
              with path.open('rb') as source:
                  digest = hashlib.file_digest(source, 'sha256').hexdigest()
              lines.append(digest + '  ' + path.name)
          lines.extend(['```', ''])
          (Path(os.environ['RUNNER_TEMP']) / 'threadshelf-release-notes.md').write_text('\n'.join(lines))
          PY

      - name: Create the GitHub source release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          prefix="release/ThreadShelf-Enhanced-${RELEASE_VERSION}-Source"
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "ThreadShelf Enhanced ${RELEASE_VERSION}" \
            --notes-file "$RUNNER_TEMP/threadshelf-release-notes.md" \
            "${prefix}.zip" "${prefix}.tar.gz"
