<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>ThreadShelf Enhanced — local semantic search for AI chats</title>
    <meta
      name="description"
      content="Local-first semantic search and backup tool for AI chat exports (Google AI Studio, OpenRouter, LM Studio, ChatGPT, Claude)."
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Apply persisted theme before first paint to avoid a flash of the wrong theme.
      try {
        var s = JSON.parse(localStorage.getItem('threadshelf:ui') || '{}');
        var t = s && s.state && s.state.theme;
        document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
